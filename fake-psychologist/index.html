<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Psychologist</title>
    <!-- Tailwind CSS for fast, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 shadow-md">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🤖 Fake Psychologist</h1>
            <!-- Button to reset/change stored key if needed -->
            <button id="resetKeyBtn" onclick="resetApiKey()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-300 transition hidden">
                Change API Key
            </button>
        </div>
    </header>

    <!-- API Key Setup Modal / Box (Shows only if no key is saved yet) -->
    <div id="keyModal" class="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl max-w-md w-full shadow-2xl space-y-4">
            <h2 class="text-lg font-bold">🔑 Enter your Gemini API Key</h2>
            <p class="text-sm text-slate-400">
                This is saved only in your browser's local storage so it never gets exposed on GitHub.
            </p>
            <input type="password" id="modalApiKeyInput" placeholder="AIzaSy..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
            <button onclick="saveApiKey()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg font-medium transition">
                Save & Start Chatting
            </button>
        </div>
    </div>

    <!-- Chat Container -->
    <main id="chatWindow" class="flex-1 max-w-2xl w-full mx-auto p-4 overflow-y-auto space-y-4">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-2">
            <div class="bg-indigo-600 text-white rounded-2xl p-3 max-w-md shadow">
                Hello! I am your customized chatbot. Type a message below to start chatting!
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="bg-slate-800 p-4 border-t border-slate-700">
        <form id="chatForm" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Type your message here..." required
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-100">
            <button type="submit" 
                class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-lg font-medium transition">
                Send
            </button>
        </form>
    </footer>

    <!-- Gemini SDK via ESM Module -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        // 💡 CHANGE YOUR PREPROMPT HERE:
        const MY_PREPROMPT = "You are a fake psychologist. You always sound like you are helping, but you'll always answer with some very bad ideas. So when a person tells you something is wrong, you give them an answer that could be the oppostite to what a real psychologist would say. You always give very bad advices.";

        const chatWindow = document.getElementById('chatWindow');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const keyModal = document.getElementById('keyModal');
        const resetKeyBtn = document.getElementById('resetKeyBtn');

        // Check if API key already exists in browser storage on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                keyModal.classList.add('hidden');
                resetKeyBtn.classList.remove('hidden');
            }
        });

        // Global functions for modal buttons
        window.saveApiKey = () => {
            const inputVal = document.getElementById('modalApiKeyInput').value.trim();
            if (!inputVal) {
                alert("Please enter a valid API key.");
                return;
            }
            localStorage.setItem('gemini_api_key', inputVal);
            keyModal.classList.add('hidden');
            resetKeyBtn.classList.remove('hidden');
        };

        window.resetApiKey = () => {
            localStorage.removeItem('gemini_api_key');
            location.reload();
        };

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!apiKey) {
                keyModal.classList.remove('hidden');
                return;
            }

            if (!text) return;

            // 1. Display User Message
            appendMessage(text, 'user');
            userInput.value = '';

            // 2. Display a temporary "Thinking..." message
            const loadingId = appendMessage("Thinking...", 'ai', true);

            try {
                // Initialize the Google Gen AI SDK using the stored key
                const ai = new GoogleGenAI({ apiKey: apiKey });

                // Call Gemini model
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                    config: {
                        systemInstruction: MY_PREPROMPT,
                    }
                });

                // Remove loading message and display actual response
                document.getElementById(loadingId).remove();
                appendMessage(response.text, 'ai');

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Error: " + error.message, 'ai');
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const messageId = 'msg-' + Math.random().toString(36).substring(2, 9);
            const isUser = sender === 'user';

            const wrapper = document.createElement('div');
            wrapper.id = messageId;
            wrapper.className = `flex items-start space-x-2 ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'bg-emerald-600 text-white rounded-2xl p-3 max-w-md shadow' 
                : 'bg-indigo-600 text-white rounded-2xl p-3 max-w-md shadow';
            
            if (isLoading) {
                bubble.classList.add('animate-pulse');
            }

            bubble.textContent = text;
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            return messageId;
        }
    </script>
</body>
</html>
