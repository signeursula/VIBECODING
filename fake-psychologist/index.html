<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">
    <header class="bg-gray-800 p-4 text-center font-bold text-xl border-b border-gray-700">
        My Custom AI Chatbot
    </header>
    
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="bg-gray-800 p-3 rounded-lg max-w-[80%]">
            Hello! Ask me anything about my custom topic.
        </div>
    </div>

    <div class="p-4 bg-gray-800 border-t border-gray-700 max-w-2xl w-full mx-auto flex gap-2">
        <input type="text" id="user-input" placeholder="Type a message..." class="flex-1 bg-gray-700 p-3 rounded-lg focus:outline-none">
        <button onclick="sendMessage()" class="bg-blue-600 px-6 rounded-lg font-semibold hover:bg-blue-500">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            // Append User Message
            chatContainer.innerHTML += `<div class="bg-blue-600 p-3 rounded-lg max-w-[80%] ml-auto">${text}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call your Vercel backend function
                const response = await fetch('https://YOUR-VERCEL-APP.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Append AI Response
                chatContainer.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg max-w-[80%]">${data.reply}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                chatContainer.innerHTML += `<div class="bg-red-600 p-3 rounded-lg max-w-[80%]">Error connecting to AI.</div>`;
            }
        }
    </script>
</body>
</html>
