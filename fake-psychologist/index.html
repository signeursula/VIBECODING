<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Psychologist</title>
    <!-- Tailwind CSS for fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">Chat with My Custom AI</h1>
        <p class="text-xs text-gray-400">Powered by Gemini & GitHub Pages</p>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Initial Assistant Message -->
        <div class="flex justify-start">
            <div class="bg-gray-800 text-gray-200 p-3 rounded-lg max-w-md">
                Hi! I'm your customized AI assistant. Ask me anything!
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="bg-gray-800 p-4">
        <form id="chat-form" class="max-w-2xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message..." 
                required
                class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-lg font-semibold transition"
            >
                Send
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        // REPLACE WITH YOUR ACTUAL GEMINI API KEY
        const apiKey = "YOUR_GEMINI_API_KEY_HERE";
        const ai = new GoogleGenAI({ apiKey: apiKey });

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        // YOUR CUSTOM PRE-PROMPT / SYSTEM INSTRUCTIONS
        const systemInstruction = "You are a sarcastic, witty robot assistant who loves retro video games. Keep answers concise.";

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // Append User Message to UI
            appendMessage(messageText, 'user');
            userInput.value = '';

            // Show loading placeholder
            const loadingId = appendMessage('Thinking...', 'bot', true);

            try {
                // Call Gemini API
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: messageText,
                    config: {
                        systemInstruction: systemInstruction,
                    }
                });

                // Remove loading message and show real response
                document.getElementById(loadingId).remove();
                appendMessage(response.text, 'bot');
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Oops! Something went wrong. Check your API key.', 'bot');
                console.error(error);
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36.substr(2, 9));
            messageDiv.id = id;
            
            if (sender === 'user') {
                messageDiv.className = 'flex justify-end';
                messageDiv.innerHTML = `<div class="bg-indigo-600 text-white p-3 rounded-lg max-w-md">${escapeHtml(text)}</div>`;
            } else {
                messageDiv.className = 'flex justify-start';
                messageDiv.innerHTML = `<div class="bg-gray-800 text-gray-200 p-3 rounded-lg max-w-md ${isLoading ? 'italic text-gray-400' : ''}">${escapeHtml(text)}</div>`;
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
