<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster High Solitaire</title>
    <!-- Tailwind CSS for clean, aesthetic styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            /* Fallback color in case the gradient layer is not painted yet */
            background-color: #ffedd5;
        }
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom scrollbar and smooth card transitions */
        .card-transition {
            transition: transform 0.2s ease, box-shadow 0.2s ease, left 0.2s ease, top 0.2s ease;
        }
        /* Purple, Orange, and Blue background effect.
            Fixed layer behind everything, so it always fills the screen, also when scrolling */
        .custom-theme-bg::before {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, #f3e8ff 0%, #ffedd5 50%, #e0f2fe 100%);
            background-repeat: no-repeat;
            background-size: cover;
            pointer-events: none;
        }
        /* Fixed pile sizing matching card dimensions exactly */
        .card-slot {
            width: 5rem;
            height: 8rem;
        }
        @media (min-width: 640px) {
            .card-slot {
                width: 7rem;
                height: 10.5rem;
            }
        }
        /* Compact grid: fixed-width columns with a small gap */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, max-content);
            gap: 0.375rem;
            justify-content: center;
        }
        @media (min-width: 640px) {
            .game-grid {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body class="custom-theme-bg min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

    <!-- Header / Control Panel -->
    <header class="w-full max-w-[52rem] mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4 bg-white/70 backdrop-blur-md rounded-2xl my-4 shadow-sm border border-purple-200/60">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center shadow-inner border border-orange-200 overflow-hidden p-1.5">
                <img src="/images/logo.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-slate-900">Monster High Solitaire</h1>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2">
            <button id="btn-undo" onclick="undoMove()" title="Undo Move" class="px-3 py-2 bg-white hover:bg-orange-50 active:scale-95 transition rounded-xl text-sm font-medium flex items-center gap-1.5 border border-orange-200 text-slate-700 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                <span>↩</span> Undo
            </button>
            <button onclick="startNewGame()" style="background-color: #32222C;" class="px-4 py-2 hover:opacity-90 active:scale-95 transition rounded-xl text-sm font-semibold flex items-center gap-1.5 shadow-sm text-white border border-[#32222C]/50">
                <span></span> New Game
            </button>
        </div>
    </header>

    <!-- Main Game Board -->
    <main class="w-full max-w-[54rem] mx-auto px-4 flex-1 flex flex-col gap-8 pb-12">
        
        <!-- Top Row: Stock, Waste, and Foundations -->
        <div class="game-grid h-44 items-center">
            <!-- Stock / Draw Pile -->
            <div id="stock-pile" onclick="handleStockClick()" class="card-slot relative rounded-xl border-2 border-dashed border-purple-300 bg-purple-50/30 flex items-center justify-center cursor-pointer hover:border-purple-400 transition group">
                <span class="text-xs text-slate-400 group-hover:text-slate-600">Draw</span>
            </div>

            <!-- Waste Pile -->
            <div id="waste-pile" class="card-slot relative rounded-xl border-2 border-sky-200/60 bg-sky-50/10 flex items-center justify-center">
                <span class="text-xs text-slate-300">Waste</span>
            </div>

            <!-- Spacer / Gap -->
            <div class="card-slot"></div>

            <!-- Foundations (4 piles) -->
            <div id="foundation-0" class="foundation-pile card-slot relative rounded-xl border-2 border-purple-200/70 bg-purple-50/20 flex items-center justify-center" data-index="0"></div>
            <div id="foundation-1" class="foundation-pile card-slot relative rounded-xl border-2 border-orange-200/70 bg-orange-50/20 flex items-center justify-center" data-index="1"></div>
            <div id="foundation-2" class="foundation-pile card-slot relative rounded-xl border-2 border-sky-200/70 bg-sky-50/20 flex items-center justify-center" data-index="2"></div>
            <div id="foundation-3" class="foundation-pile card-slot relative rounded-xl border-2 border-purple-200/70 bg-purple-50/20 flex items-center justify-center" data-index="3"></div>
        </div>

        <!-- Bottom Row: Tableau Piles -->
        <div class="game-grid flex-1 min-h-[460px] content-start">
            <div id="tableau-0" class="tableau-pile card-slot relative" data-index="0"></div>
            <div id="tableau-1" class="tableau-pile card-slot relative" data-index="1"></div>
            <div id="tableau-2" class="tableau-pile card-slot relative" data-index="2"></div>
            <div id="tableau-3" class="tableau-pile card-slot relative" data-index="3"></div>
            <div id="tableau-4" class="tableau-pile card-slot relative" data-index="4"></div>
            <div id="tableau-5" class="tableau-pile card-slot relative" data-index="5"></div>
            <div id="tableau-6" class="tableau-pile card-slot relative" data-index="6"></div>
        </div>
    </main>

    <!-- Stuck / No More Moves Notice Banner -->
    <div id="stuck-notice" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-orange-100 border border-orange-300 text-orange-900 px-6 py-3 rounded-2xl shadow-lg hidden items-center gap-3 z-40 animate-bounce duration-1000">
        <span class="text-lg">💡</span>
        <div class="text-sm font-medium">No more available moves! Try using <span class="font-bold underline">Undo</span> or start a <span class="font-bold underline">New Game</span>.</div>
        <button onclick="dismissStuckNotice()" class="ml-2 text-slate-400 hover:text-slate-700 font-bold text-base">&times;</button>
    </div>

    <!-- Win Modal Overlay -->
    <div id="win-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white border border-purple-200 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4 animate-in fade-in zoom-in duration-300">
            <div class="w-16 h-16 bg-purple-100 border border-purple-200 rounded-full flex items-center justify-center text-3xl">🏆</div>
            <h2 class="text-2xl font-bold text-purple-800">Wonderful Victory!</h2>
            <p class="text-sm text-slate-600">You completed the game with style and color. Ready for another round?</p>
            <button onclick="startNewGame(); closeWinModal();" style="background-color: #32222C;" class="w-full py-3 hover:opacity-90 font-semibold text-white rounded-xl shadow-md transition mt-2">
                Play Again
            </button>
        </div>
    </div>

    <!-- Game Logic -->
    <script>
        // Suits and Values configuration
        const SUITS = ['hearts', 'diamonds', 'clubs', 'spades'];
        const SYMBOLS = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };
        const COLORS = { hearts: 'red', diamonds: 'red', clubs: 'black', spades: 'black' };
        const RANK_NAMES = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };
        const SUIT_PREFIX = { hearts: 'H', diamonds: 'D', clubs: 'C', spades: 'S' };

        // Game State Variables
        let deck = [];
        let stock = [];
        let waste = [];
        let foundations = [[], [], [], []];
        let tableau = [[], [], [], [], [], [], []];
        let history = [];
        
        let moves = 0;
        let gameActive = false;

        let draggedCardData = null; // { source, pileIndex, cardIndex }

        // Initialize on load
        window.onload = function() {
            startNewGame();
        };

        function startNewGame() {
            moves = 0;
            history = [];
            gameActive = false;
            updateStatsUI();
            closeWinModal();
            dismissStuckNotice();

            deck = createDeck();
            shuffleDeck(deck);

            // Deal cards to tableau
            tableau = [[], [], [], [], [], [], []];
            foundations = [[], [], [], []];
            waste = [];
            stock = [];

            for (let i = 0; i < 7; i++) {
                for (let j = i; j < 7; j++) {
                    let card = deck.pop();
                    card.faceUp = (j === i); // Only top card face up
                    tableau[j].push(card);
                }
            }

            stock = deck;
            deck = [];

            renderGame();
        }

        function createDeck() {
            let d = [];
            let id = 1;
            for (let suit of SUITS) {
                for (let value = 1; value <= 13; value++) {
                    d.push({
                        id: id++,
                        suit: suit,
                        value: value,
                        faceUp: false
                    });
                }
            }
            return d;
        }

        function shuffleDeck(d) {
            for (let i = d.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [d[i], d[j]] = [d[j], d[i]];
            }
        }

        function updateStatsUI() {
            document.getElementById('btn-undo').disabled = history.length === 0;
        }

        // Snapshot for Undo feature
        function saveState() {
            let stateSnapshot = {
                stock: JSON.parse(JSON.stringify(stock)),
                waste: JSON.parse(JSON.stringify(waste)),
                foundations: JSON.parse(JSON.stringify(foundations)),
                tableau: JSON.parse(JSON.stringify(tableau)),
                moves: moves
            };
            history.push(stateSnapshot);
            if (history.length > 30) history.shift(); // Limit history
            updateStatsUI();
        }

        function undoMove() {
            if (history.length === 0) return;
            let lastState = history.pop();
            stock = lastState.stock;
            waste = lastState.waste;
            foundations = lastState.foundations;
            tableau = lastState.tableau;
            moves = lastState.moves;
            renderGame();
            updateStatsUI();
            dismissStuckNotice();
        }

        // Stock interaction
        function handleStockClick() {
            gameActive = true;
            saveState();
            dismissStuckNotice();

            if (stock.length > 0) {
                let card = stock.pop();
                card.faceUp = true;
                waste.push(card);
                moves++;
            } else {
                // Recycle waste back to stock
                while (waste.length > 0) {
                    let card = waste.pop();
                    card.faceUp = false;
                    stock.push(card);
                }
            }
            renderGame();
            checkWinCondition();
            checkStuckCondition();
        }

        // Render Game Board UI
        function renderGame() {
            // Render Stock Pile
            let stockEl = document.getElementById('stock-pile');
            stockEl.innerHTML = '';
            if (stock.length > 0) {
                stockEl.innerHTML = `<div class="w-full h-full bg-purple-100 rounded-xl border border-purple-300 shadow-sm flex items-center justify-center text-purple-700 font-bold text-lg select-none">🂠</div>`;
            } else {
                stockEl.innerHTML = `<span class="text-xs text-slate-400">↺</span>`;
            }

            // Render Waste Pile
            let wasteEl = document.getElementById('waste-pile');
            wasteEl.innerHTML = '';
            if (waste.length > 0) {
                let topCard = waste[waste.length - 1];
                let cardDiv = createCardElement(topCard, 'waste', 0, waste.length - 1);
                wasteEl.appendChild(cardDiv);
            }

            // Render Foundations
            for (let i = 0; i < 4; i++) {
                let fEl = document.getElementById(`foundation-${i}`);
                fEl.innerHTML = `<span class="absolute text-xs text-purple-700/30">${SYMBOLS[SUITS[i]]}</span>`;
                if (foundations[i].length > 0) {
                    let topCard = foundations[i][foundations[i].length - 1];
                    let cardDiv = createCardElement(topCard, 'foundation', i, foundations[i].length - 1);
                    fEl.appendChild(cardDiv);
                }
            }

            // Render Tableau
            for (let i = 0; i < 7; i++) {
                let tEl = document.getElementById(`tableau-${i}`);
                tEl.innerHTML = '';
                let pile = tableau[i];
                
                if (pile.length === 0) {
                    tEl.innerHTML = `<div class="absolute inset-0 rounded-xl border-2 border-dashed border-sky-300/40"></div>`;
                } else {
                    pile.forEach((card, cardIndex) => {
                        let cardDiv = createCardElement(card, 'tableau', i, cardIndex);
                        // Stagger cards vertically
                        cardDiv.style.top = `${cardIndex * 32}px`;
                        tEl.appendChild(cardDiv);
                    });
                }
            }
        }

        // Card Element Builder using Custom Images
        function createCardElement(card, source, pileIndex, cardIndex) {
            let el = document.createElement('div');
            el.className = `absolute card-slot rounded-xl card-transition shadow-sm flex flex-col justify-between select-none overflow-hidden ${card.faceUp ? 'bg-white border border-purple-200 cursor-grab hover:shadow-md' : 'bg-gradient-to-br from-purple-100 via-orange-50 to-sky-100 border border-purple-300'}`;
            el.style.zIndex = cardIndex + 1;

            if (card.faceUp) {
                let rankStr = RANK_NAMES[card.value] || card.value;
                let prefix = SUIT_PREFIX[card.suit];
                let imgPath = `images/${prefix}-${rankStr}.png`;

                let img = document.createElement('img');
                img.src = imgPath;
                img.alt = `${rankStr} of ${card.suit}`;
                img.className = 'w-full h-full object-cover rounded-xl pointer-events-none';
                
                // Fallback mechanism if image fails to load
                img.onerror = function() {
                    this.remove();
                    let isRed = COLORS[card.suit] === 'red';
                    let textColor = isRed ? 'text-orange-600' : 'text-slate-800';
                    let suitSymbol = SYMBOLS[card.suit];
                    el.className += ` p-2 ${textColor}`;
                    el.innerHTML = `
                        <div class="flex justify-between items-start text-xs sm:text-sm font-bold leading-none">
                            <span>${rankStr}</span>
                            <span>${suitSymbol}</span>
                        </div>
                        <div class="self-center text-3xl sm:text-4xl my-auto opacity-90">
                            ${suitSymbol}
                        </div>
                        <div class="flex justify-between items-end text-xs sm:text-sm font-bold leading-none rotate-180">
                            <span>${rankStr}</span>
                            <span>${suitSymbol}</span>
                        </div>
                    `;
                };

                el.appendChild(img);

                // Dragging & Click Event bindings
                el.draggable = true;
                el.addEventListener('dragstart', (e) => {
                    gameActive = true;
                    dismissStuckNotice();
                    draggedCardData = { source, pileIndex, cardIndex };
                    e.dataTransfer.setData('text/plain', JSON.stringify(draggedCardData));
                    setTimeout(() => el.classList.add('opacity-40'), 0);
                });

                el.addEventListener('dragend', () => {
                    el.classList.remove('opacity-40');
                });

                // Double click to auto-move to foundation
                el.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    tryAutoMoveCard(source, pileIndex, cardIndex);
                });

            } else {
                el.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center opacity-40 text-lg text-purple-800">
                        ✦
                    </div>
                `;
            }

            return el;
        }

        // Setup drop zones for drag & drop
        document.addEventListener('DOMContentLoaded', () => {
            // Tableau drop zones
            for (let i = 0; i < 7; i++) {
                let tZone = document.getElementById(`tableau-${i}`);
                setupDropZone(tZone, 'tableau', i);
            }

            // Foundation drop zones
            for (let i = 0; i < 4; i++) {
                let fZone = document.getElementById(`foundation-${i}`);
                setupDropZone(fZone, 'foundation', i);
            }
        });

        function setupDropZone(element, targetType, targetIndex) {
            element.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            element.addEventListener('drop', (e) => {
                e.preventDefault();
                if (!draggedCardData) return;

                let source = draggedCardData.source;
                let sPileIndex = draggedCardData.pileIndex;
                let cIndex = draggedCardData.cardIndex;

                if (isValidMove(source, sPileIndex, cIndex, targetType, targetIndex)) {
                    saveState();
                    executeMove(source, sPileIndex, cIndex, targetType, targetIndex);
                    moves++;
                    renderGame();
                    checkWinCondition();
                    checkStuckCondition();
                }
                draggedCardData = null;
            });
        }

        // Rule Validation for Klondike Solitaire
        function isValidMove(srcType, srcPileIdx, cardIdx, tgtType, tgtPileIdx) {
            let cardToMove;

            // Extract card(s)
            if (srcType === 'waste') {
                if (cardIdx !== waste.length - 1) return false;
                cardToMove = waste[waste.length - 1];
            } else if (srcType === 'tableau') {
                let pile = tableau[srcPileIdx];
                if (!pile[cardIdx].faceUp) return false;
                cardToMove = pile[cardIdx];
            } else if (srcType === 'foundation') {
                if (cardIdx !== foundations[srcPileIdx].length - 1) return false;
                cardToMove = foundations[srcPileIdx][cardIdx];
            }

            if (tgtType === 'foundation') {
                // Can only move single card to foundation
                if (srcType === 'tableau' && cardIdx !== tableau[srcPileIdx].length - 1) return false;
                
                let fPile = foundations[tgtPileIdx];
                if (fPile.length === 0) {
                    return cardToMove.value === 1; // Ace required
                } else {
                    let topCard = fPile[fPile.length - 1];
                    return cardToMove.suit === topCard.suit && cardToMove.value === topCard.value + 1;
                }
            } else if (tgtType === 'tableau') {
                let tPile = tableau[tgtPileIdx];
                if (tPile.length === 0) {
                    return cardToMove.value === 13; // King required for empty tableau spot
                } else {
                    let topCard = tPile[tPile.length - 1];
                    if (!topCard.faceUp) return false;
                    let alternatingColor = COLORS[cardToMove.suit] !== COLORS[topCard.suit];
                    let descendingValue = cardToMove.value === topCard.value - 1;
                    return alternatingColor && descendingValue;
                }
            }
            return false;
        }

        // Execute Move logic
        function executeMove(srcType, srcPileIdx, cardIdx, tgtType, tgtPileIdx) {
            let movedCards = [];

            if (srcType === 'waste') {
                movedCards.push(waste.pop());
            } else if (srcType === 'tableau') {
                let pile = tableau[srcPileIdx];
                movedCards = pile.splice(cardIdx, pile.length - cardIdx);
                // Reveal new top card if any
                if (pile.length > 0 && !pile[pile.length - 1].faceUp) {
                    pile[pile.length - 1].faceUp = true;
                }
            } else if (srcType === 'foundation') {
                movedCards.push(foundations[srcPileIdx].pop());
            }

            // Append to target
            if (tgtType === 'foundation') {
                foundations[tgtPileIdx].push(movedCards[0]);
            } else if (tgtType === 'tableau') {
                tableau[tgtPileIdx].push(...movedCards);
            }
        }

        // Double click auto-move feature
        function tryAutoMoveCard(srcType, srcPileIdx, cardIdx) {
            gameActive = true;
            dismissStuckNotice();

            // Only top card can auto-move to foundations
            let card;
            if (srcType === 'waste') {
                if (cardIdx !== waste.length - 1) return;
                card = waste[waste.length - 1];
            } else if (srcType === 'tableau') {
                if (cardIdx !== tableau[srcPileIdx].length - 1) return;
                card = tableau[srcPileIdx][cardIdx];
            } else {
                return;
            }

            // Try to find a matching foundation
            for (let fIdx = 0; fIdx < 4; fIdx++) {
                if (isValidMove(srcType, srcPileIdx, cardIdx, 'foundation', fIdx)) {
                    saveState();
                    executeMove(srcType, srcPileIdx, cardIdx, 'foundation', fIdx);
                    moves++;
                    renderGame();
                    checkWinCondition();
                    checkStuckCondition();
                    return;
                }
            }
        }

        // Check if any valid move exists across the entire board
        function checkStuckCondition() {
            // If there are still cards in the stock pile, player can always draw
            if (stock.length > 0) {
                dismissStuckNotice();
                return;
            }

            // Check waste pile against foundations & tableaus
            if (waste.length > 0) {
                let wIdx = waste.length - 1;
                for (let f = 0; f < 4; f++) {
                    if (isValidMove('waste', 0, wIdx, 'foundation', f)) return;
                }
                for (let t = 0; t < 7; t++) {
                    if (isValidMove('waste', 0, wIdx, 'tableau', t)) return;
                }
            }

            // Check all tableau face-up cards against foundations & other tableaus
            for (let srcT = 0; srcT < 7; srcT++) {
                let pile = tableau[srcT];
                let c = 0;
                while (c < pile.length) {
                    if (!pile[c].faceUp) {
                        c++;
                        continue;
                    }

                    // Check foundation moves
                    for (let f = 0; f < 4; f++) {
                        if (isValidMove('tableau', srcT, c, 'foundation', f)) return;
                    }

                    // Check tableau moves
                    for (let tgtT = 0; tgtT < 7; tgtT++) {
                        if (srcT === tgtT) continue;
                        if (isValidMove('tableau', srcT, c, 'tableau', tgtT)) return;
                    }
                    c++;
                }
            }

            // If we checked everything and found no valid moves anywhere, show stuck notice
            showStuckNotice();
        }

        function showStuckNotice() {
            let notice = document.getElementById('stuck-notice');
            notice.classList.remove('hidden');
            notice.classList.add('flex');
        }

        function dismissStuckNotice() {
            let notice = document.getElementById('stuck-notice');
            notice.classList.remove('flex');
            notice.classList.add('hidden');
        }

        // Win condition check
        function checkWinCondition() {
            let totalFoundationCards = foundations.reduce((sum, f) => sum + f.length, 0);
            if (totalFoundationCards === 52) {
                dismissStuckNotice();
                document.getElementById('win-modal').classList.remove('hidden');
                document.getElementById('win-modal').classList.add('flex');
            }
        }

        function closeWinModal() {
            let modal = document.getElementById('win-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
