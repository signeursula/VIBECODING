<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gæt tallet</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --text: #2b2620;
    --muted: #6f6a60;
    --accent: #d9622b;
    --accent-dark: #b34e1f;
    --key-bg: #efe9dd;
    --key-bg-hover: #e3dac8;
    --key-text: #2b2620;
    --border: #e0d9c9;
    --easy: #4a8b5c;
    --medium: #c98a1c;
    --hard: #c23b3b;
    --shadow: rgba(0,0,0,0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #1c1a17;
      --card-bg: #262320;
      --text: #f0ece3;
      --muted: #b3ab9c;
      --accent: #e97a3d;
      --accent-dark: #f0925f;
      --key-bg: #33302a;
      --key-bg-hover: #403c34;
      --key-text: #f0ece3;
      --border: #3a362e;
      --easy: #6cb883;
      --medium: #e0a94a;
      --hard: #e06868;
      --shadow: rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --card-bg: #262320;
    --text: #f0ece3;
    --muted: #b3ab9c;
    --accent: #e97a3d;
    --accent-dark: #f0925f;
    --key-bg: #33302a;
    --key-bg-hover: #403c34;
    --key-text: #f0ece3;
    --border: #3a362e;
    --easy: #6cb883;
    --medium: #e0a94a;
    --hard: #e06868;
    --shadow: rgba(0,0,0,0.35);
  }

  html, body {
    height: 100%;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 14px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 18px var(--shadow);
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .range-badge {
    background: var(--key-bg);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 600;
  }

  .guess-display {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 56px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    border: 2px dashed var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    color: var(--accent);
    transition: border-color 0.2s ease;
  }
  .guess-display.filled {
    border-style: solid;
    border-color: var(--accent);
  }
  .guess-display .placeholder {
    color: var(--muted);
    font-weight: 400;
    font-size: 1.1rem;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .key {
    background: var(--key-bg);
    color: var(--key-text);
    border: none;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 1.3rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.05s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .key:hover { background: var(--key-bg-hover); }
  .key:active { transform: scale(0.95); }

  .key.zero { grid-column: 2; }
  .key.wide { grid-column: span 1; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .action-row .key {
    font-size: 1rem;
  }
  .btn-guess {
    grid-column: 1 / -1;
    background: var(--accent);
    color: #fff;
    padding: 16px 0;
    font-size: 1.15rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    margin-top: 10px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn-guess:hover { background: var(--accent-dark); }
  .btn-guess:active { transform: scale(0.98); }
  .btn-guess:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .clues-card h2 {
    margin: 0 0 10px 0;
    font-size: 1.05rem;
  }
  .clue-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .clue-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--key-bg);
    font-size: 0.92rem;
    line-height: 1.35;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .clue-item .guess-num {
    font-weight: 700;
    color: var(--muted);
    min-width: 26px;
  }
  .tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-right: 6px;
    color: #fff;
    vertical-align: middle;
  }
  .tag.easy { background: var(--easy); }
  .tag.medium { background: var(--medium); }
  .tag.hard { background: var(--hard); }

  .empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 8px 0;
  }

  .win-banner {
    display: none;
    text-align: center;
    background: var(--easy);
    color: #fff;
    border-radius: 14px;
    padding: 18px;
    font-size: 1.1rem;
    font-weight: 700;
    box-shadow: 0 6px 18px var(--shadow);
  }
  .win-banner.show { display: block; }
  .win-banner .sub {
    display: block;
    font-weight: 400;
    font-size: 0.9rem;
    margin-top: 6px;
    opacity: 0.95;
  }

  .btn-restart {
    margin-top: 12px;
    background: #fff;
    color: var(--accent-dark);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Gæt tallet</h1>
      <p>Hvilket tal vil du gætte på?</p>
    </header>

    <div class="win-banner" id="winBanner">
      🎉 Du gættede rigtigt!
      <span class="sub" id="winSub"></span>
      <br>
      <button class="btn-restart" id="restartBtn">Spil igen</button>
    </div>

    <div class="card" id="guessCard">
      <div class="status-row">
        <span class="range-badge">1 – 50</span>
        <span id="attemptsLabel">0 gæt</span>
      </div>
      <div class="guess-display" id="guessDisplay">
        <span class="placeholder">Indtast et tal…</span>
      </div>
      <div class="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key zero" data-digit="0">0</button>
      </div>
      <div class="action-row">
        <button class="key" id="clearBtn">Ryd</button>
        <button class="key" id="backspaceBtn">⌫ Slet</button>
      </div>
      <button class="btn-guess" id="guessBtn" disabled>Gæt!</button>
    </div>

    <div class="card clues-card">
      <h2>Dine spor</h2>
      <ul class="clue-list" id="clueList">
        <li class="empty-hint">Dine gæt og spor vises her.</li>
      </ul>
    </div>
  </div>

<script>
(function() {
  "use strict";

  // ---------- Clue database ----------
  // Each clue has a difficulty tier and a "match" test for whether it applies
  // to the target number.
  const CLUES = {
    easy: [
      { text: "Du kan gå", test: n => n >= 2 && n <= 50 },
      { text: "Dette ville være et højt antal af katte at eje", test: n => n >= 5 && n <= 50 },
      { text: "Hvis du drikker dette antal øl, brækker du dig nok", test: n => n >= 20 && n <= 50 },
      { text: "Du kan nok ikke ligge i planken i så mange minutter", test: n => n >= 7 && n <= 50 },
      { text: "Du må gerne køre bil", test: n => n >= 16 && n <= 50 },
      { text: "Du bør ikke køre hurtigere end dette tal km/t i et villakvarter", test: n => n >= 1 && n <= 35 }
    ],
    medium: [
      { text: "Du ville ikke være tilfreds, hvis du fik dette antal slikstykker i din slikpose", test: n => n >= 1 && n <= 12 },
      { text: "Du har ikke et fuldskæg i denne alder", test: n => n >= 1 && n <= 14 },
      { text: "Du bor hjemme ved dine forældre i denne alder", test: n => n >= 1 && n <= 15 },
      { text: "Du har en typisk alder til at tage uddannelse i", test: n => n >= 17 && n <= 28 },
      { text: "Du har eller bør have fået kanel", test: n => n >= 25 && n <= 50 },
      { text: "Du har ikke fået kanel endnu", test: n => n >= 1 && n <= 24 },
      { text: "Du må ikke køre bil", test: n => n >= 1 && n <= 15 },
      { text: "Du cykler hurtigt, hvis dette tal er dit km/t", test: n => n >= 30 && n <= 50 }
    ],
    hard: [
      { text: "Du er målgruppen for at være fan af et boyband i denne alder", test: n => n >= 12 && n <= 17 },
      { text: "Du ville være glad, hvis du fik denne karakter i skolen", test: n => n === 10 || n === 12 },
      { text: "Du har ikke lært at gå endnu", test: n => n === 1 },
      { text: "Du ville kunne drikke så mange kopper kaffe på en dag", test: n => n >= 1 && n <= 8 },
      { text: "Dette er et normalt antal børn at få", test: n => n >= 1 && n <= 3 },
      { text: "Denne dato er vigtig i december", test: n => n === 24 || n === 31 },
      { text: "Du er lige blevet teenager", test: n => n === 13 || n === 14 },
      { text: "Du bruger nok stadig sut", test: n => n >= 1 && n <= 2 }
    ]
  };

  const MIN = 1, MAX = 50;

  // ---------- Game state ----------
  let target = null;
  let currentInput = "";
  let attempts = 0;
  let usedClueTexts = new Set();
  let won = false;

  const guessDisplay = document.getElementById("guessDisplay");
  const guessBtn = document.getElementById("guessBtn");
  const clueList = document.getElementById("clueList");
  const attemptsLabel = document.getElementById("attemptsLabel");
  const winBanner = document.getElementById("winBanner");
  const winSub = document.getElementById("winSub");
  const guessCard = document.getElementById("guessCard");

  function randomTarget() {
    return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
  }

  function resetGame() {
    target = randomTarget();
    currentInput = "";
    attempts = 0;
    usedClueTexts = new Set();
    won = false;
    winBanner.classList.remove("show");
    guessCard.style.display = "";
    attemptsLabel.textContent = "0 gæt";
    clueList.innerHTML = '<li class="empty-hint">Dine gæt og spor vises her.</li>';
    updateGuessDisplay();
    updateGuessButton();
  }

  function updateGuessDisplay() {
    if (currentInput === "") {
      guessDisplay.innerHTML = '<span class="placeholder">Indtast et tal…</span>';
      guessDisplay.classList.remove("filled");
    } else {
      guessDisplay.textContent = currentInput;
      guessDisplay.classList.add("filled");
    }
  }

  function updateGuessButton() {
    const n = parseInt(currentInput, 10);
    guessBtn.disabled = won || currentInput === "" || isNaN(n) || n < MIN || n > MAX;
  }

  function addDigit(d) {
    if (won) return;
    // Prevent numbers longer than 2 digits (max is 50) or leading beyond range usefulness
    if (currentInput.length >= 2) return;
    const next = currentInput + d;
    if (parseInt(next, 10) > MAX && next.length > 0) {
      // allow typing "5" then "0" => 50 is fine; but block e.g. "6" then digit since >50 already
      if (parseInt(currentInput, 10) > MAX) return;
    }
    currentInput = next;
    updateGuessDisplay();
    updateGuessButton();
  }

  function backspace() {
    if (won) return;
    currentInput = currentInput.slice(0, -1);
    updateGuessDisplay();
    updateGuessButton();
  }

  function clearInput() {
    if (won) return;
    currentInput = "";
    updateGuessDisplay();
    updateGuessButton();
  }

  // Pick the difficulty tier based on how many wrong attempts so far
  function tierForAttempt(attemptNumber) {
    if (attemptNumber <= 2) return "easy";
    if (attemptNumber <= 4) return "medium";
    return "hard";
  }

  function pickClue(attemptNumber) {
    const tiers = ["easy", "medium", "hard"];
    const preferredTier = tierForAttempt(attemptNumber);
    const startIdx = tiers.indexOf(preferredTier);

    // Try preferred tier first, then fall back to other tiers (harder ones first,
    // since we're deeper into the game; then easier ones) if nothing fits/unused.
    const order = [preferredTier].concat(tiers.filter(t => t !== preferredTier));

    for (const tier of order) {
      const candidates = CLUES[tier].filter(c => c.test(target) && !usedClueTexts.has(c.text));
      if (candidates.length > 0) {
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        usedClueTexts.add(chosen.text);
        return { tier, text: chosen.text };
      }
    }

    // All themed clues for this number have been used - fall back to a
    // simple higher/lower hint so the game never dries up.
    return null;
  }

  function fallbackHint(guess) {
    if (guess < target) {
      return { tier: "hard", text: "Tallet er højere end det, du gættede på" };
    } else {
      return { tier: "hard", text: "Tallet er lavere end det, du gættede på" };
    }
  }

  function tierLabel(tier) {
    if (tier === "easy") return "Let";
    if (tier === "medium") return "Mellem";
    return "Svær";
  }

  function addClueEntry(guess, clueObj) {
    // Remove empty hint if present
    const emptyHint = clueList.querySelector(".empty-hint");
    if (emptyHint) emptyHint.remove();

    const li = document.createElement("li");
    li.className = "clue-item";
    li.innerHTML =
      '<span class="guess-num">' + guess + '</span>' +
      '<span><span class="tag ' + clueObj.tier + '">' + tierLabel(clueObj.tier) + '</span>' + clueObj.text + '</span>';
    clueList.insertBefore(li, clueList.firstChild);
  }

  function addWinEntry(guess) {
    const emptyHint = clueList.querySelector(".empty-hint");
    if (emptyHint) emptyHint.remove();

    const li = document.createElement("li");
    li.className = "clue-item";
    li.innerHTML =
      '<span class="guess-num">' + guess + '</span>' +
      '<span><span class="tag easy">Rigtigt!</span>Du gættede tallet 🎉</span>';
    clueList.insertBefore(li, clueList.firstChild);
  }

  function submitGuess() {
    const n = parseInt(currentInput, 10);
    if (isNaN(n) || n < MIN || n > MAX || won) return;

    attempts++;
    attemptsLabel.textContent = attempts + (attempts === 1 ? " gæt" : " gæt");

    if (n === target) {
      won = true;
      addWinEntry(n);
      winSub.textContent = "Tallet var " + target + ". Du brugte " + attempts + (attempts === 1 ? " gæt." : " gæt.");
      winBanner.classList.add("show");
      currentInput = "";
      updateGuessDisplay();
      updateGuessButton();
      return;
    }

    let clueObj = pickClue(attempts);
    if (!clueObj) clueObj = fallbackHint(n);
    addClueEntry(n, clueObj);

    currentInput = "";
    updateGuessDisplay();
    updateGuessButton();
  }

  // ---------- Event wiring ----------
  document.querySelectorAll(".key[data-digit]").forEach(btn => {
    btn.addEventListener("click", () => addDigit(btn.getAttribute("data-digit")));
  });
  document.getElementById("backspaceBtn").addEventListener("click", backspace);
  document.getElementById("clearBtn").addEventListener("click", clearInput);
  guessBtn.addEventListener("click", submitGuess);
  document.getElementById("restartBtn").addEventListener("click", resetGame);

  // Allow physical keyboard too
  document.addEventListener("keydown", (e) => {
    if (e.key >= "0" && e.key <= "9") addDigit(e.key);
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Enter") submitGuess();
    else if (e.key === "Escape") clearInput();
  });

  resetGame();
})();
</script>
</body>
</html>
