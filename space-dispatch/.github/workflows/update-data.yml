name: Update Space Data

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: Allows you to run it manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Data from NASA API
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const apiKey = process.env.NASA_API_KEY;
            const url = `https://api.nasa.gov/planetary/apod?api_key=${apiKey}`;

            https.get(url, (res) => {
              let data = "";
              res.on("data", (chunk) => { data += chunk; });
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  const cleanData = {
                    title: json.title,
                    date: json.date,
                    explanation: json.explanation,
                    url: json.url
                  };
                  fs.writeFileSync("data.json", JSON.stringify(cleanData, null, 2));
                  console.log("Data updated successfully!");
                } catch (e) {
                  console.error("Failed to parse API response:", e);
                  process.exit(1);
                }
              });
            }).on("error", (err) => {
              console.error("Error fetching data:", err);
              process.exit(1);
            });
          '

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily automated data update [skip ci]" && git push)
