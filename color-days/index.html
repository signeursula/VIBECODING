<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which colors are the days?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --ink: #1C1E2B;
    --muted: #6B6F85;
    --line: #E3E5EE;
    --chip: #ECEEF5;
    --font: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: var(--font); line-height: 1.5;
    display: flex; justify-content: center; padding: 32px 16px 56px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 8px; }
  h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  p.lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 28px; max-width: 46ch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
  .hidden { display: none !important; }

  /* Rainbow strip: the one memorable element */
  .strip { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin-bottom: 28px; border: 1px solid var(--line); }
  .strip span { flex: 1; }

  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: var(--ink); }

  button.main {
    font: inherit; font-weight: 600; font-size: 1.05rem; color: #fff; background: var(--ink);
    border: 0; border-radius: 12px; padding: 13px 24px; cursor: pointer; transition: transform .1s, opacity .2s;
  }
  button.main:hover:not(:disabled) { transform: translateY(-1px); }
  button.main:disabled { opacity: .3; cursor: not-allowed; }
  button.main:focus-visible, .sw:focus-visible { outline: 3px solid #1E63E9; outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

  .notice { background: var(--chip); border-radius: 12px; padding: 12px 16px; margin: 14px 0 20px; font-weight: 600; }
  .progress { color: var(--muted); font-size: .95rem; margin-bottom: 6px; }

  /* Question rows */
  .q { padding: 18px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; }
  .q .prompt { color: var(--muted); font-size: .95rem; }
  .word { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: #C5C8D6; transition: color .15s; }
  .word.white { -webkit-text-stroke: 1.5px #B9BDCE; paint-order: stroke fill; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .sw {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.14);
    cursor: pointer; padding: 0; transition: transform .1s;
  }
  .sw:hover { transform: scale(1.12); }
  .sw.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .cname { color: var(--muted); font-size: .9rem; min-height: 1.4em; margin-top: 8px; }

  /* Reveal */
  .score { font-size: 1.15rem; font-weight: 600; margin: 8px 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 12px; }
  .grid .head { font-weight: 800; font-size: 1.05rem; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); }
  .grid .head.r { text-align: right; }
  .grid .vs { color: var(--muted); font-size: .85rem; text-align: center; }
  .grid .cell { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .grid .cell.r { text-align: right; }
  .grid .word { font-size: clamp(1.4rem, 6vw, 2.1rem); }
  .grid .cn { display: block; font-size: .85rem; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .match { font-size: .8rem; font-weight: 600; color: #2E7D32; }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="strip" id="strip"></div>

  <!-- Screen 1: names -->
  <section id="s-setup">
    <h1>Which colors are the days?</h1>
    <p class="lead">Do you and your friend see the days of the week in the same colors? Pick your colors in secret, then compare.</p>
    <div class="card">
      <label for="n1">Player 1</label>
      <input type="text" id="n1" maxlength="20" placeholder="Type your name" autocomplete="off">
      <label for="n2">Player 2</label>
      <input type="text" id="n2" maxlength="20" placeholder="Type your name" autocomplete="off">
      <button class="main" id="start" disabled>Start the game</button>
    </div>
  </section>

  <!-- Screen 2: answering -->
  <section id="s-quiz" class="hidden">
    <div class="progress" id="turn"></div>
    <h2 id="who"></h2>
    <div class="notice" id="look"></div>
    <div class="card">
      <div id="qs"></div>
      <button class="main" id="next" disabled style="margin-top:12px"></button>
    </div>
  </section>

  <!-- Screen 3: reveal -->
  <section id="s-reveal" class="hidden">
    <h2>The reveal</h2>
    <div class="notice">Both players can look now!</div>
    <div class="score" id="score"></div>
    <div class="card"><div class="grid" id="grid"></div></div>
    <div class="actions">
      <button class="main" id="again">Play again</button>
    </div>
  </section>
</main>

<script>
  const COLORS = [
    ['Red', '#E53935'], ['Orange', '#FB8C00'], ['Yellow', '#FDD835'], ['Green', '#43A047'],
    ['Turquoise', '#1DC8B8'], ['Blue', '#1E63E9'], ['Purple', '#7E3FD1'], ['Magenta', '#D5158C'],
    ['Pink', '#FF8FC0'], ['Black', '#111111'], ['White', '#f0f0f0']
  ];
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  const $ = id => document.getElementById(id);
  const names = ['', ''];
  const answers = [[], []];   // answers[player][dayIndex] = color index
  let current = 0;

  $('strip').innerHTML = COLORS.map(c => `<span style="background:${c[1]}"></span>`).join('');

  function show(id) {
    ['s-setup', 's-quiz', 's-reveal'].forEach(s => $(s).classList.toggle('hidden', s !== id));
    window.scrollTo(0, 0);
  }

  // Setup
  function checkNames() { $('start').disabled = !($('n1').value.trim() && $('n2').value.trim()); }
  $('n1').addEventListener('input', checkNames);
  $('n2').addEventListener('input', checkNames);
  $('start').addEventListener('click', () => {
    names[0] = $('n1').value.trim();
    names[1] = $('n2').value.trim();
    if (names[0].toLowerCase() === names[1].toLowerCase()) names[1] += ' (2)';
    answers[0] = []; answers[1] = [];
    startTurn(0);
  });

  // Quiz
  function startTurn(p) {
    current = p;
    const other = names[1 - p];
    $('turn').textContent = `Player ${p + 1} of 2`;
    $('who').textContent = `${names[p]}, it's your turn`;
    $('look').textContent = `${other}, look away while ${names[p]} answers.`;
    $('next').textContent = p === 0 ? 'Done' : 'Reveal answers';
    $('next').disabled = true;

    $('qs').innerHTML = '';
    DAYS.forEach((day, i) => {
      const q = document.createElement('div');
      q.className = 'q';
      q.innerHTML = `<div class="prompt">Which color is ${day}?</div>
        <div class="word" id="w${i}">${day}</div>
        <div class="swatches"></div>
        <div class="cname" id="c${i}"></div>`;
      const box = q.querySelector('.swatches');
      COLORS.forEach((c, ci) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sw';
        b.style.background = c[1];
        b.title = c[0];
        b.setAttribute('aria-label', `${day}: ${c[0]}`);
        b.addEventListener('click', () => pick(i, ci, box));
        box.appendChild(b);
      });
      $('qs').appendChild(q);
    });
    show('s-quiz');
  }

  function pick(day, ci, box) {
    answers[current][day] = ci;
    const w = $('w' + day);
    w.style.color = COLORS[ci][1];
    w.classList.toggle('white', COLORS[ci][0] === 'White');
    $('c' + day).textContent = COLORS[ci][0];
    [...box.children].forEach((b, k) => b.classList.toggle('on', k === ci));
    $('next').disabled = DAYS.some((_, i) => answers[current][i] === undefined);
  }

  $('next').addEventListener('click', () => {
    if (current === 0) startTurn(1); else reveal();
  });

  // Reveal
  function reveal() {
    let matches = 0;
    const g = $('grid');
    g.innerHTML = '';
    const add = (cls, html) => {
      const d = document.createElement('div');
      d.className = cls; d.innerHTML = html; g.appendChild(d); return d;
    };
    add('head', '').textContent = names[0];
    add('', '');
    add('head r', '').textContent = names[1];

    DAYS.forEach((day, i) => {
      const a = COLORS[answers[0][i]], b = COLORS[answers[1][i]];
      const same = a[0] === b[0];
      if (same) matches++;
      const cell = (c, r) => `<span class="word ${c[0] === 'White' ? 'white' : ''}" style="color:${c[1]}">${day}</span><span class="cn">${c[0]}</span>`;
      add('cell', cell(a));
      add('cell vs', same ? '<span class="match">match!</span>' : 'vs');
      add('cell r', cell(b));
    });

    $('score').textContent = matches === 0
      ? 'No matches this time. You see the week very differently!'
      : `You picked the same color for ${matches} of 7 days.`;
    show('s-reveal');
  }

  $('again').addEventListener('click', () => {
    $('n1').value = ''; $('n2').value = ''; checkNames();
    show('s-setup');
  });
</script>
</body>
</html>
