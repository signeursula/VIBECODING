<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regency &amp; Romance – Rating af Signe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: rgb(59, 15, 15);
  --card: rgb(129, 11, 56);
  --card-hover: rgb(150, 20, 70);
  --accent: rgb(220, 195, 170);
  --text: rgb(241, 226, 209);
  --muted: rgb(220, 195, 170);
  --radius: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 20px;
  max-width: 1200px;
  margin-inline: auto;
}

header {
  text-align: center;
  padding: 40px 0 20px;
  border-bottom: 1px solid var(--card);
  margin-bottom: 40px;
}

header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  letter-spacing: -0.05em;
  margin-bottom: 10px;
}

.count {
  display: inline-block;
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 0.9rem;
  font-weight: 500;
}
.count b { color: var(--accent); }

section { margin-bottom: 50px; }

section h2 {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 20px;
}

/* ---- Filtre ---- */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.filters button {
  font: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.filters button:hover,
.filters button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--bg);
}

.filters button:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 2px;
}

/* ---- Kort ---- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s ease, background-color 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
  background: var(--card-hover);
}

.card > img {
  width: 100%;
  height: 380px;
  object-fit: cover;
  object-position: center;
  display: block;
  background: var(--bg);
  border-bottom: 1px solid var(--card);
}

.card-body {
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  padding: 15px;
}

.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.card-meta {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 12px;
}

.card-stars {
  font-size: 1.1rem;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.card-note {
  margin-top: auto;
  font-size: 0.85rem;
  font-style: italic;
  background: rgba(84, 26, 26, 0.5);
  border: 1px solid rgba(220, 195, 170, 0.2);
  border-radius: 6px;
  padding: 8px;
}

.empty { color: var(--muted); }

/* ---- Senest sete ---- */
.latest {
  flex-direction: row;
  border-color: var(--accent);
  max-width: 600px;
}

.latest > img {
  width: 180px;
  height: 270px;
  flex-shrink: 0;
  border-bottom: none;
  border-right: 1px solid var(--card);
}

.latest:hover { transform: none; background: var(--card); }

.latest .card-body { padding: 20px; }

@media (max-width: 600px) {
  .latest { flex-direction: column; }
  .latest > img {
    width: 100%;
    height: 380px;
    border-right: none;
    border-bottom: 1px solid var(--card);
  }
}

@media (prefers-reduced-motion: reduce) {
  .card, .filters button { transition: none; }
  .card:hover { transform: none; }
}
</style>
</head>
<body>

<header>
  <h1>Regency &amp; Romance <br> Rating af Signe</h1>
  <p class="count">Antal sete titler: <b id="count"></b></p>
</header>

<main>
  <section>
    <h2>Senest sete</h2>
    <div id="latest"></div>
  </section>

  <section>
    <h2>Alle sete Film &amp; Serier</h2>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" aria-pressed="true">Alle</button>
      <button type="button" data-filter="5" aria-pressed="false">5 ★</button>
      <button type="button" data-filter="4" aria-pressed="false">4 ★</button>
      <button type="button" data-filter="3" aria-pressed="false">3 ★</button>
      <button type="button" data-filter="2" aria-pressed="false">2 ★</button>
      <button type="button" data-filter="1" aria-pressed="false">1 ★</button>
    </div>

    <div class="grid" id="library"></div>
  </section>
</main>

<script>
// Sidste titel i listen er den senest sete.
const titles = [
  { title: "Pride and Prejudice", type: "Film", year: 2005, rating: 4, note: "Skøn skøn skøn Jane Austen roman! Den bliver jeg aldrig træt af.", poster: "plakater/prideandprejudice.jpg" },
  { title: "Atonement", type: "Film", year: 2007, rating: 2, note: "Hjerteskærende og ubehagelig, men også en lille smule kedelig.", poster: "plakater/atonement.jpg" },
  { title: "Little Women", type: "Film", year: 2019, rating: 5, note: "Virkelig sød film, med SÅ søde piger. De spiller alle sammen så karismatisk godt", poster: "plakater/littlewomen.jpg" },
  { title: "Enola Holmes", type: "Film", year: 2020, rating: 5, note: "Så fedt med en romantisk krimi med kvinde-power, og Millie Bobby Brown er fantastisk i rollen.", poster: "plakater/enolaholmes1.jpg" },
  { title: "Enola Holmes 2", type: "Film", year: 2022, rating: 3, note: "Rigtig god efterfølger, men slår ikke 1'eren.", poster: "plakater/enolaholmes2.jpg" },
  { title: "Enola Holmes 3", type: "Film", year: 2026, rating: 4, note: "Spændende film, og fedt med nye mysterier på Cypern. Som altid søde charmerende karakterer.", poster: "plakater/enolaholmes3.jpg" },
  { title: "Wuthering Heights", type: "Film", year: 2026, rating: 2, note: "Trods at mange taler dårligt om denne film på nettet, synes jeg, at den gjorde det ret godt. Jeg kunne godt lide deres passion.", poster: "plakater/wutheringheights.jpg" },
  { title: "Victoria, sæson 1", type: "Serie", year: 2016, rating: 1, note: "I princippet kan jeg godt lide en serie om dronning Victoria. Men denne serie var ret kedelig.", poster: "plakater/victoria.jpg" },
  { title: "Bridgerton, sæson 1", type: "Serie", year: 2020, rating: 5, note: "Jeg startede på Bridgerton, fordi jeg var nysgerrig på, hvorfor alle kvinder elsker den... NU FORSTÅR JEG!", poster: "plakater/bridgerton1.jpg" },
  { title: "Bridgerton, sæson 2", type: "Serie", year: 2020, rating: 5, note: "Sæson 2 levede totalt op til 1'eren. Spændende nye karakterer. Man bliver totalt opslugt af universet.", poster: "plakater/bridgerton2.jpg" },
  { title: "Bridgerton, sæson 3", type: "Serie", year: 2020, rating: 5, note: "Jeg har hørt en del personer sige, at de ikke kunne lide sæson 3. Jeg synes nu, at den var super god og spændende!", poster: "plakater/bridgerton3.jpg" },
  { title: "Bridgerton, sæson 4", type: "Serie", year: 2026, rating: 5, note: "Bridgerton er 100% min yndlingsserie. Hold op den er bare fængende og god! Sæson 4 skuffer ikke.", poster: "plakater/bridgerton4.jpg" },
  { title: "Queen Charlotte: A Bridgerton Story", type: "Serie", year: 2023, rating: 4, note: "Meget sød, men ikke lige så god som selve Bridgerton.", poster: "plakater/queencharlotte.jpg" },
  { title: "Love Through a Prism", type: "Serie", year: 2026, rating: 3, note: "Meget nuser anime. Den var lidt slow-paced, og jeg hader når anime piger hvine-skriger. Men ellers virkelig sød.", poster: "plakater/lovethroughaprism.jpg" },
  { title: "The Other Bennet Sister", type: "Serie", year: 2026, rating: 5, note: "Elsker elsker elsker Mary Bennet. Hvor var denne serie charmerende.", poster: "plakater/theotherbennetsister.jpg" },
  { title: "My Brilliant Career", type: "Serie", year: 2026, rating: 4, note: "Virkelig god serie med den sødeste hovedperson. Dog var slutningen skuffende...", poster: "plakater/mybrilliantcareer.jpg" },
  { title: "The Buccaneers, sæson 1", type: "Serie", year: 2023, rating: 3, note: "Denne serier vokser på mig. Den er okay spændende -og også virkelig flot lavet. Men jeg elsker ikke karakterene.", poster: "plakater/thebuccaneers1.jpg" },
  { title: "The Buccaneers, sæson 2", type: "Serie", year: 2025, rating: 4, note: "Jeg kan klart bedre lide sæson 2! Den er super god og spændende! Dog handler den liiiidt for meget om utroskab.", poster: "plakater/thebuccaneers2.jpg" }
];

const stars = rating => "★".repeat(rating) + "☆".repeat(5 - rating);

function buildCard(item, extraClass, showScore) {
  const card = document.createElement("article");
  card.className = extraClass ? "card " + extraClass : "card";

  const poster = document.createElement("img");
  poster.src = item.poster;
  poster.alt = "Plakat: " + item.title;
  poster.loading = "lazy";
  card.append(poster);

  const body = document.createElement("div");
  body.className = "card-body";

  const title = document.createElement("h3");
  title.className = "card-title";
  title.textContent = item.title;

  const meta = document.createElement("p");
  meta.className = "card-meta";
  meta.textContent = item.type + " • " + item.year;

  const score = document.createElement("p");
  score.className = "card-stars";
  score.textContent = showScore
    ? stars(item.rating) + " (" + item.rating + "/5)"
    : stars(item.rating);

  const note = document.createElement("p");
  note.className = "card-note";
  note.textContent = '"' + item.note + '"';

  body.append(title, meta, score, note);
  card.append(body);
  return card;
}

function showCount() {
  document.getElementById("count").textContent = titles.length + " titler";
}

function showLatest() {
  const box = document.getElementById("latest");
  box.replaceChildren(buildCard(titles.at(-1), "latest", true));
}

function showLibrary(filter) {
  const library = document.getElementById("library");
  const sorted = [...titles].sort((a, b) => a.title.localeCompare(b.title, "da"));
  const shown = filter === "all" ? sorted : sorted.filter(t => t.rating === Number(filter));

  if (shown.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Ingen titler fundet med denne rangering.";
    library.replaceChildren(empty);
    return;
  }

  library.replaceChildren(...shown.map(item => buildCard(item, "", false)));
}

document.getElementById("filters").addEventListener("click", event => {
  const button = event.target.closest("button[data-filter]");
  if (!button) return;

  for (const other of event.currentTarget.querySelectorAll("button")) {
    other.setAttribute("aria-pressed", String(other === button));
  }
  showLibrary(button.dataset.filter);
});

showCount();
showLatest();
showLibrary("all");
</script>
</body>
</html>
