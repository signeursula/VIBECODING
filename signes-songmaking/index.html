<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signe's songmaking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Signe's songmaking</h1>
      <p>Pick four chords. Press play. Sing.</p>
    </header>

    <section class="track" id="track" aria-label="Chord track"></section>

    <section class="song">
      <div class="section-head">
        <h2>Loops</h2>
        <span>Each loop plays your four chords. Tap a feel — it works while playing too.</span>
      </div>
      <div class="loops" id="loopList"></div>
    </section>

    <section class="controls">
      <button id="play" class="play" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>

      <label class="field">
        <span>Tempo</span>
        <input id="tempo" type="range" min="50" max="160" step="1" value="90">
        <output id="tempoOut">90 bpm</output>
      </label>
    </section>

    <section class="export">
      <select id="repeat" aria-label="How many times to repeat the loops in the download">
        <option value="1">Loops × 1</option>
        <option value="2" selected>Loops × 2</option>
        <option value="4">Loops × 4</option>
      </select>
      <button id="download" class="ghost">Download MP3</button>
      <span id="status" class="status"></span>
    </section>

    <p class="hint">Space = play / stop · While playing: 1 = Strum, 2 = Gentle, 3 = Let ring (changes the loop that's playing)</p>
  </main>

  <div id="picker" class="picker" hidden>
    <div class="picker-label">Root</div>
    <div class="grid roots" id="roots"></div>
    <div class="picker-label">Type</div>
    <div class="grid types" id="types"></div>
    <button id="clear" class="link">Clear chord</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
