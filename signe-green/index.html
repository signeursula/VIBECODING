<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gæt en Signe-grøn</title>
<style>
  :root {
    --bg: #111;
    --text: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
  }

  #title {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 28px 16px 20px;
    font-size: clamp(18px, 4vw, 30px);
    font-weight: 600;
    letter-spacing: 0.3px;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.25);
    transition: opacity 0.4s ease;
  }
  #title.hidden { opacity: 0; }

  #hint {
    position: fixed;
    bottom: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    transition: opacity 0.4s ease;
  }
  #hint.hidden { opacity: 0; }

  #game {
    display: flex;
    width: 100%;
    height: 100%;
  }

  .half {
    flex: 1 1 50%;
    height: 100%;
    cursor: pointer;
    transition: flex-grow 0.7s cubic-bezier(.65,0,.35,1), flex-basis 0.7s cubic-bezier(.65,0,.35,1);
  }
  .half:active {
    filter: brightness(0.95);
  }

  #game.decided .half.winner {
    flex-grow: 999;
    flex-basis: 100%;
  }
  #game.decided .half.loser {
    flex-grow: 0;
    flex-basis: 0%;
    cursor: default;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 0.55s;
    z-index: 20;
  }
  #overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  #overlay-message {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 700;
    margin-bottom: 28px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.4);
    max-width: 700px;
  }

  #retry-btn {
    background: rgba(0,0,0,0.75);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 999px;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #retry-btn:hover {
    background: rgba(0,0,0,0.9);
    transform: translateY(-2px);
  }
  #retry-btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

  <div id="title">Signe elsker grønne farver... MEN<br>kun nogle grønne er Signe-grønne!<br>Hvilken grøn er Signe-grøn?</div>
  <div id="hint">Klik på den grønne side, du tror er rigtig</div>

  <div id="game">
    <div class="half" id="left"></div>
    <div class="half" id="right"></div>
  </div>

  <div id="overlay">
    <div id="overlay-message"></div>
    <button id="retry-btn">Prøv igen</button>
  </div>

<script>
  const correctColors = [
    "#A9D97C", "#8CBF5C", "#648749", "#9DD446", "#739936",
    "#E7F5C6", "#D5F296", "#B1D65E", "#607D27", "#B6C969",
    "#A9C437", "#ABB370", "#99AB43", "#84B856", "#A7D67E",
    "#79E041", "#79D615", "#C4F296", "#B5E685"
  ];

  const wrongColors = [
    "#00FF5E", "#94E0C0", "#2FED81", "#A1D6BB", "#8CBDA5",
    "#71BD97", "#3D916F", "#44B882", "#AFE0CC", "#A6E0C1",
    "#2AE87C", "#73FFB0", "#216E5F", "#41967F", "#A3D1BB", "#75BD9B"
  ];

  const gameEl = document.getElementById('game');
  const leftEl = document.getElementById('left');
  const rightEl = document.getElementById('right');
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const overlayEl = document.getElementById('overlay');
  const overlayMsgEl = document.getElementById('overlay-message');
  const retryBtn = document.getElementById('retry-btn');

  let lastColors = [];
  let leftColor, rightColor, leftIsCorrect;

  function pickColor(list, exclude) {
    let options = list.filter(c => !exclude.includes(c));
    if (options.length === 0) options = list;
    return options[Math.floor(Math.random() * options.length)];
  }

  function newRound() {
    // reset visual state
    gameEl.classList.remove('decided');
    leftEl.classList.remove('winner', 'loser');
    rightEl.classList.remove('winner', 'loser');
    overlayEl.classList.remove('show');
    titleEl.classList.remove('hidden');
    hintEl.classList.remove('hidden');

    const correctColor = pickColor(correctColors, lastColors);
    const wrongColor = pickColor(wrongColors, lastColors);
    lastColors = [correctColor, wrongColor];

    leftIsCorrect = Math.random() < 0.5;
    leftColor = leftIsCorrect ? correctColor : wrongColor;
    rightColor = leftIsCorrect ? wrongColor : correctColor;

    leftEl.style.background = leftColor;
    rightEl.style.background = rightColor;

    leftEl.onclick = () => handleChoice('left');
    rightEl.onclick = () => handleChoice('right');
  }

  function handleChoice(side) {
    leftEl.onclick = null;
    rightEl.onclick = null;

    const chosenIsCorrect = (side === 'left') ? leftIsCorrect : !leftIsCorrect;

    if (side === 'left') {
      leftEl.classList.add('winner');
      rightEl.classList.add('loser');
    } else {
      rightEl.classList.add('winner');
      leftEl.classList.add('loser');
    }
    gameEl.classList.add('decided');

    titleEl.classList.add('hidden');
    hintEl.classList.add('hidden');

    overlayMsgEl.textContent = chosenIsCorrect
      ? "Korrekt! Dette er en rigtig Signe-grøn 🙌"
      : "Forkert! Det er ikke en Signe-grøn... ❌";

    setTimeout(() => {
      overlayEl.classList.add('show');
    }, 50);
  }

  retryBtn.addEventListener('click', newRound);

  newRound();
</script>

</body>
</html>
